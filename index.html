<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 성가대 연습실 | 찬양곡 검색</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎶</text></svg>">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://csy870617.github.io/ChurchChoir/">
    <meta property="og:title" content="성가대 연습실">
    <meta property="og:description" content="찬양곡 연습하러 오세요!">
    <meta property="og:image" content="https://csy870617.github.io/ChurchChoir/ad/thumbnail2.png">

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/variable/pretendardvariable.css">
    <link rel="stylesheet" href="style.css?v=3">

    <script src="concise_data.js?v=4"></script>
    <script type="module" src="main.js?v=4"></script>
</head>
<body>
    <main class="page">
        <div class="card">
            <header class="hero">
                <span class="hero-badge">🎶</span>
                <h1>성가대 연습실</h1>
                <p class="hero-subtitle">찬양곡 제목을 검색하면 중앙아트 파트연습실로 바로 이동해요</p>
            </header>

            <form class="search-bar" onsubmit="event.preventDefault(); searchAndRedirect(this);">
                <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm9 2-5.2-5.2"/>
                </svg>
                <input type="text" name="query" id="search-input" placeholder="찬양곡 제목 입력..." required>
                <button type="submit">검색</button>
            </form>
            <p class="hint">*중앙아트에 수록된 곡만 검색됩니다.</p>
        </div>

        <a href="https://csy870617.github.io/faiths/" target="_blank" class="ad-card">
            <img src="ad/0.png" alt="FAITHS" class="ad-icon">
            <span class="ad-text">
                <strong>FAITHS 크리스천 성장 도구 플랫폼</strong>
                <em>더 멋진 크리스천으로 함께 성장해요</em>
            </span>
            <svg class="ad-arrow" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/>
            </svg>
        </a>

        <footer>
            <a href="https://www.joongangart.kr/partpractice/partpractice.html" target="_blank">
                데이터 출처 및 저작권: 중앙아트(Joongang Art Co.)
            </a>
        </footer>
    </main>

    <div id="selection-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>🔍 중복 곡 선택</h3>
            <div id="modal-options-list" class="modal-options"></div>
        </div>
    </div>

</body>
</html>
