<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성가대 연습실 | 찬양곡 검색</title>
    <script>
        // 저장된 테마가 다크모드일 때만 속성을 붙임 (기본값은 라이트 모드) — 깜빡임 방지를 위해 CSS 로드 전에 실행
        try {
            if (localStorage.getItem('choir_theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%230A84FF%22/><path d=%22M9 18V5l12-2v13%22 fill=%22none%22 stroke=%22white%22 stroke-width=%221.8%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/><circle cx=%226%22 cy=%2218%22 r=%223%22 fill=%22white%22/><circle cx=%2218%22 cy=%2216%22 r=%223%22 fill=%22white%22/></svg>">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://csy870617.github.io/ChurchChoir/">
    <meta property="og:title" content="성가대 연습실">
    <meta property="og:description" content="찬양곡 연습하러 오세요!">
    <meta property="og:image" content="https://csy870617.github.io/ChurchChoir/ad/thumbnail2.png">

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/variable/pretendardvariable.css">
    <link rel="stylesheet" href="style.css?v=5">

    <script src="concise_data.js?v=4"></script>
    <script type="module" src="main.js?v=5"></script>
</head>
<body>
    <button type="button" id="btn-theme-toggle" class="theme-toggle" onclick="toggleTheme()" aria-label="라이트/다크 모드 전환">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/>
        </svg>
    </button>

    <main class="page">
        <header class="hero">
            <div class="mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="26" height="26">
                    <path d="M9 18V5l12-2v13" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="6" cy="18" r="3" fill="white"/>
                    <circle cx="18" cy="16" r="3" fill="white"/>
                </svg>
            </div>
            <h1>성가대 연습실</h1>
            <p class="hero-subtitle">찬양곡 제목을 검색하면<br>중앙아트 파트연습실로 바로 이동해요</p>
        </header>

        <form class="search-bar" onsubmit="event.preventDefault(); searchAndRedirect(this);">
            <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm9 2-5.2-5.2"/>
            </svg>
            <input type="text" name="query" id="search-input" placeholder="찬양곡 제목 입력..." required>
            <button type="submit">검색</button>
        </form>
        <p class="hint">중앙아트에 수록된 곡만 검색됩니다</p>

        <button type="button" id="btn-open-room" class="btn-room" onclick="openRoomModal()">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-5h-4v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5Z"/>
            </svg>
            우리교회 연습실 만들기
        </button>

        <section id="room-section" class="room-section" style="display: none;">
            <div class="room-header">
                <div>
                    <h2 id="room-title-church"></h2>
                    <p id="room-title-choir" class="room-subtitle"></p>
                </div>
                <div class="room-header-actions">
                    <button type="button" class="btn-invite" onclick="inviteMembers()">
                        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0-12 4 4m-4-4-4 4M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/>
                        </svg>
                        초대
                    </button>
                    <button type="button" class="btn-logout" onclick="logoutRoom()">나가기</button>
                </div>
            </div>

            <div class="board-block">
                <div class="board-block-header">
                    <h3>공지사항</h3>
                    <button type="button" id="btn-show-write" class="btn-write" onclick="showWriteForm()" aria-label="글쓰기">✏️</button>
                </div>

                <div id="board-list">
                    <div id="post-items"></div>
                    <button id="btn-load-more" class="btn-load-more" style="display: none;" onclick="loadMorePosts()">더 보기</button>
                </div>

                <div id="board-write" class="write-form" style="display: none;">
                    <input type="hidden" id="edit-mode-id">
                    <div class="write-row">
                        <input type="text" id="write-title" class="input-title" placeholder="제목">
                        <input type="text" id="write-author" class="input-author" placeholder="작성자">
                    </div>
                    <textarea id="write-content" class="input-full" placeholder="공지할 내용을 자유롭게 작성하세요"></textarea>
                    <div class="write-actions">
                        <div class="left-group">
                            <button type="button" id="btn-delete-post" class="btn-small btn-danger" style="display: none;" onclick="deletePostFromForm()">삭제</button>
                        </div>
                        <div class="right-group">
                            <button type="button" class="btn-small btn-cancel" onclick="showBoardList()">취소</button>
                            <button type="button" class="btn-small btn-save" onclick="savePost()">등록</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="board-block">
                <div class="board-block-header">
                    <h3>찬양곡 게시판</h3>
                    <button type="button" class="btn-write" onclick="openSongEditModal()">＋ 곡 추가</button>
                </div>
                <div id="song-list" class="song-list"></div>
            </div>
        </section>

        <footer>
            <a href="https://www.joongangart.kr/partpractice/partpractice.html" target="_blank">
                데이터 출처 및 저작권: 중앙아트(Joongang Art Co.)
            </a>
        </footer>
    </main>

    <div id="selection-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="vertical-align:-3px; margin-right:6px;">
                    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm9 2-5.2-5.2"/>
                </svg>
                중복 곡 선택
            </h3>
            <div id="modal-options-list" class="modal-options"></div>
        </div>
    </div>

    <div id="room-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>우리교회 연습실</h3>
            <p class="modal-desc">교회 이름, 성가대 이름, 비밀번호를 입력하세요.<br>새 연습실을 만들거나 기존 연습실에 입장할 수 있어요.</p>
            <input type="text" id="room-church" class="input-full" placeholder="교회 이름">
            <input type="text" id="room-choir" class="input-full" placeholder="성가대 이름">
            <input type="password" id="room-pw" class="input-full" placeholder="비밀번호">
            <div class="modal-footer-row">
                <button type="button" class="btn-small btn-cancel" onclick="closeRoomModal()">닫기</button>
                <div class="right-group">
                    <button type="button" class="btn-small btn-outline" onclick="createRoom()">만들기</button>
                    <button type="button" class="btn-small btn-save" onclick="loginRoom()">입장하기</button>
                </div>
            </div>
        </div>
    </div>

    <div id="song-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="song-modal-title">찬양곡 추가</h3>

            <div class="link-method-block">
                <div class="link-action-search">
                    <input type="text" id="song-joongang-search-input" placeholder="중앙아트 찬양곡 검색" onkeydown="if(event.key === 'Enter') { event.preventDefault(); searchJoongangArt(); }">
                    <button type="button" onclick="searchJoongangArt()">검색</button>
                </div>
                <div id="song-joongang-search-msg" class="search-msg" style="display: none;"></div>
            </div>

            <div class="link-method-divider"><span>또는</span></div>

            <div class="link-method-block">
                <p class="link-method-label">찬양곡 직접 추가하기</p>

                <div class="title-search-group">
                    <input type="text" id="song-title" class="input-full-url" placeholder="곡 제목 입력(필수)" onkeydown="if(event.key === 'Enter') { event.preventDefault(); searchMySongs(); }">
                    <button type="button" class="btn-inline-search" onclick="searchMySongs()" aria-label="예전에 등록한 곡 검색">
                        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm9 2-5.2-5.2"/>
                        </svg>
                    </button>
                </div>

                <div class="title-row">
                    <input type="text" id="song-book" class="input-full-url" placeholder="책 제목">
                    <div class="date-field">
                        <svg class="date-field-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                            <rect x="3" y="4" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
                            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8 2v4M16 2v4M3 10h18"/>
                        </svg>
                        <input type="date" id="song-date" class="input-full-url" aria-label="부를 날짜 선택(필수)" required>
                    </div>
                </div>
            </div>
            <div id="song-title-search-msg" class="search-msg" style="display: none;"></div>

            <div class="link-method-block">
                <input type="text" id="song-url-all" class="input-full-url" placeholder="유튜브 링크(합창) 직접 붙여넣기">
            </div>

            <button type="button" id="btn-toggle-parts" class="btn-toggle-section" onclick="toggleCollapsible('song-part-inputs', this)">▸ 파트별 링크 추가하기 (선택)</button>
            <div id="song-part-inputs" style="display: none;">
                <input type="text" id="song-url-sop" class="input-full-url input-part" placeholder="소프라노 링크">
                <input type="text" id="song-url-alt" class="input-full-url input-part" placeholder="알토 링크">
                <input type="text" id="song-url-ten" class="input-full-url input-part" placeholder="테너 링크">
                <input type="text" id="song-url-bas" class="input-full-url input-part" placeholder="베이스 링크">
            </div>

            <div class="modal-footer-row">
                <div class="left-group">
                    <button type="button" id="btn-remove-song" class="btn-small btn-danger" style="display: none;" onclick="deleteSongLink()">삭제</button>
                </div>
                <div class="right-group">
                    <button type="button" class="btn-small btn-cancel" onclick="closeSongModal()">닫기</button>
                    <button type="button" class="btn-small btn-save" onclick="saveSongLink()">저장</button>
                </div>
            </div>
        </div>
    </div>

    <div id="play-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="text-align: center;">
            <h3 id="play-modal-title">파트 선택</h3>
            <div class="play-modal-grid">
                <button id="modal-play-all" class="btn-play btn-play-all" onclick="openDirectLink('all')">합창</button>
                <button id="modal-play-sop" class="btn-play" onclick="openDirectLink('sop')">소프라노</button>
                <button id="modal-play-alt" class="btn-play" onclick="openDirectLink('alt')">알토</button>
                <button id="modal-play-ten" class="btn-play" onclick="openDirectLink('ten')">테너</button>
                <button id="modal-play-bas" class="btn-play" onclick="openDirectLink('bas')">베이스</button>
            </div>
            <button type="button" class="btn-small btn-cancel" onclick="closePlayModal()" style="margin-top: 20px;">닫기</button>
        </div>
    </div>

</body>
</html>
